<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netcup VNC console</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd;
               font: 14px system-ui, sans-serif; }
  #bar { padding: 6px 10px; background: #16161a; border-bottom: 1px solid #26262c; }
  #status { color: #9aa; }
  #screen { width: 100%; height: calc(100% - 33px); }
</style>
</head>
<body>
  <div id="bar">netcup VNC — <span id="status">connecting…</span></div>
  <div id="screen"></div>
  <script type="module">
    import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.5.0/lib/rfb.js';

    const status = document.getElementById('status');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/websockify`;

    const rfb = new RFB(document.getElementById('screen'), url);
    rfb.scaleViewport = true;
    rfb.clipViewport = false;
    rfb.focusOnClick = true;

    rfb.addEventListener('connect', () => { status.textContent = 'connected'; });
    rfb.addEventListener('disconnect', (e) => {
      status.textContent = e.detail.clean ? 'disconnected' : 'connection lost';
    });
    rfb.addEventListener('securityfailure', (e) => {
      status.textContent = 'auth failed: ' + (e.detail.reason || '');
    });
  </script>
</body>
</html>
