version: "3"

vars:
  # Pinned so local runs and CI produce byte-identical generated code.
  # Keep in sync with .github/workflows/ci.yml.
  OAPI_CODEGEN_VERSION: v2.8.2

tasks:
  generate:
    desc: Regenerate client from OpenAPI spec
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -config oapi-codegen.yaml openapi.json

  spec-check:
    desc: Report differences between openapi.json and netcup's live spec
    cmds:
      - python3 scripts/spec-drift.py

  spec-update:
    desc: Replace openapi.json with netcup's live spec (sanitized)
    cmds:
      - python3 scripts/spec-drift.py --update

  build:
    desc: Build netcup-scp binary
    cmds:
      - go build ./cmd/netcup-scp/

  test:
    desc: Run tests
    cmds:
      - go test -v -race -cover ./...

  test-unit:
    desc: Run unit tests only
    cmds:
      - go test -v -short ./pkg/scp/...

  install:
    desc: Install netcup-scp to $GOBIN
    cmds:
      - go install ./cmd/netcup-scp

  clean:
    desc: Remove build caches
    cmds:
      - go clean -cache

  godoc:
    desc: Serve documentation and open in browser
    cmds:
      - cmd: |
          if command -v open &> /dev/null; then
            open http://localhost:6060/pkg/github.com/digilolnet/go-netcup-scp/
          elif command -v xdg-open &> /dev/null; then
            xdg-open http://localhost:6060/pkg/github.com/digilolnet/go-netcup-scp/
          fi
        silent: true
      - godoc -http=:6060

  check:
    desc: Run all checks (build, test)
    cmds:
      - task: build
      - task: test

  all:
    desc: Generate, build, and test
    cmds:
      - task: generate
      - task: build
      - task: test
